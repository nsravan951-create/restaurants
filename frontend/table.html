<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f1eb;
        --panel: #fffaf2;
        --ink: #2a2118;
        --muted: #6d6051;
        --line: #e8dbc8;
        --accent: #c84f20;
        --accent-strong: #9f3a14;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Sora', sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 10%, #fff7df 0%, transparent 35%),
          radial-gradient(circle at 80% 5%, #f9e4d8 0%, transparent 30%),
          var(--bg);
      }

      .page {
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px;
      }

      .hero,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
      }

      .hero {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px;
      }

      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        object-fit: cover;
        border: 1px solid var(--line);
        background: linear-gradient(135deg, #f7be8c, #f3d79a);
      }

      .logo-fallback {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.1rem;
      }

      .hero h1 {
        margin: 0;
        font-family: 'Fraunces', serif;
        font-size: 1.8rem;
      }

      .meta {
        margin: 6px 0 0;
        color: var(--muted);
      }

      .state {
        margin-top: 16px;
        padding: 14px;
      }

      .state.hidden,
      .hidden {
        display: none;
      }

      .error {
        color: #7f1d1d;
        border-color: #f3b6b6;
        background: #fff2f2;
      }

      .menu {
        margin-top: 16px;
        display: grid;
        gap: 16px;
      }

      .category {
        padding: 14px;
      }

      .category h2 {
        margin: 0 0 12px;
        font-family: 'Fraunces', serif;
        font-size: 1.2rem;
      }

      .items {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .item {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }

      .item img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        display: block;
        background: #f4ede2;
      }

      .item-body {
        padding: 10px;
      }

      .item h3 {
        margin: 0 0 6px;
        font-size: 1rem;
      }

      .item p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .price {
        margin-top: 8px;
        color: var(--accent-strong);
        font-weight: 600;
      }

      .retry-btn {
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        padding: 8px 12px;
        font-weight: 600;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        .hero {
          align-items: flex-start;
        }

        .hero h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <img id="restaurantLogo" class="logo hidden" alt="Restaurant logo" />
        <div id="restaurantLogoFallback" class="logo logo-fallback">--</div>
        <div>
          <h1 id="restaurantTitle">Restaurant</h1>
          <p id="tableInfo" class="meta"></p>
        </div>
      </header>

      <section id="loadingState" class="panel state">Loading menu, please wait...</section>

      <section id="errorState" class="panel state error hidden">
        <p id="errorText">Something went wrong while loading the menu.</p>
        <button id="retryBtn" class="retry-btn" type="button">Try again</button>
      </section>

      <section id="menuContainer" class="menu hidden"></section>
    </main>

    <script>
      const API_BASE_URL = 'https://my-render-backend.onrender.com/api/menu';

      const restaurantTitleEl = document.getElementById('restaurantTitle');
      const restaurantLogoEl = document.getElementById('restaurantLogo');
      const restaurantLogoFallbackEl = document.getElementById('restaurantLogoFallback');
      const tableInfoEl = document.getElementById('tableInfo');
      const loadingStateEl = document.getElementById('loadingState');
      const errorStateEl = document.getElementById('errorState');
      const errorTextEl = document.getElementById('errorText');
      const retryBtnEl = document.getElementById('retryBtn');
      const menuContainerEl = document.getElementById('menuContainer');

      const cart = new Map();
      let currentContext = null;
      let cartElements = null;

      function getTableIdFromPath() {
        const match = window.location.pathname.match(/\/table\/([^/?#]+)/i);
        if (match && match[1]) {
          return decodeURIComponent(match[1]);
        }

        const parts = window.location.pathname.split('/').filter(Boolean);
        const tableIndex = parts.lastIndexOf('table');
        if (tableIndex !== -1 && parts[tableIndex + 1]) {
          return decodeURIComponent(parts[tableIndex + 1]);
        }

        return null;
      }

      function setLoading(isLoading) {
        loadingStateEl.classList.toggle('hidden', !isLoading);
      }

      function setError(message) {
        errorTextEl.textContent = message;
        errorStateEl.classList.remove('hidden');
      }

      function clearError() {
        errorStateEl.classList.add('hidden');
      }

      function formatPrice(amount) {
        const value = Number(amount || 0);
        return `INR ${value.toFixed(2)}`;
      }

      function escapeStoragePart(value) {
        return String(value || '').trim().replace(/[^a-zA-Z0-9_-]/g, '_');
      }

      function getStorageNamespace(context) {
        const parts = [escapeStoragePart(window.location.hostname)];

        if (context?.restaurant?.id) {
          parts.push(`r${escapeStoragePart(context.restaurant.id)}`);
        }

        if (context?.table?.id) {
          parts.push(`t${escapeStoragePart(context.table.id)}`);
        } else if (context?.tableId) {
          parts.push(`t${escapeStoragePart(context.tableId)}`);
        }

        return parts.join(':');
      }

      function getCartKey(namespace) {
        return `qr_table_cart_${namespace}`;
      }

      function getSessionKey(namespace) {
        return `qr_table_session_${namespace}`;
      }

      function readJsonStorage(key) {
        const raw = localStorage.getItem(key);
        if (!raw) {
          return null;
        }

        try {
          return JSON.parse(raw);
        } catch (error) {
          return null;
        }
      }

      function writeJsonStorage(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function buildFallbackInitials(name) {
        return String(name || 'R')
          .trim()
          .split(/\s+/)
          .slice(0, 2)
          .map((part) => part.charAt(0).toUpperCase())
          .join('') || 'R';
      }

      function setRestaurantLogo(restaurant) {
        const logoCandidate =
          restaurant.logo_url ||
          restaurant.logoUrl ||
          restaurant.image_url ||
          restaurant.imageUrl ||
          '';

        restaurantLogoFallbackEl.textContent = buildFallbackInitials(restaurant.name || 'R');

        if (!logoCandidate) {
          restaurantLogoEl.classList.add('hidden');
          restaurantLogoFallbackEl.classList.remove('hidden');
          return;
        }

        restaurantLogoEl.src = logoCandidate;
        restaurantLogoEl.onload = () => {
          restaurantLogoEl.classList.remove('hidden');
          restaurantLogoFallbackEl.classList.add('hidden');
        };
        restaurantLogoEl.onerror = () => {
          restaurantLogoEl.classList.add('hidden');
          restaurantLogoFallbackEl.classList.remove('hidden');
        };
      }

      function normalizeMenuItems(items) {
        if (!Array.isArray(items)) {
          return [];
        }

        return items.map((item) => ({
          id: item.id,
          name: item.name || 'Untitled item',
          description: item.description || 'No description available.',
          category: item.category || 'Other',
          price: Number(item.price || 0),
          imageUrl: item.image_url || item.imageUrl || '',
          isAvailable: item.is_available !== false,
        }));
      }

      function groupByCategory(menuItems) {
        const grouped = new Map();

        menuItems.forEach((item) => {
          const category = item.category || 'Other';
          if (!grouped.has(category)) {
            grouped.set(category, []);
          }
          grouped.get(category).push(item);
        });

        return grouped;
      }

      function ensureStyleTag() {
        if (document.getElementById('tablePageDynamicStyles')) {
          return;
        }

        const style = document.createElement('style');
        style.id = 'tablePageDynamicStyles';
        style.textContent = `
          .table-session-panel {
            margin-top: 16px;
            padding: 16px;
          }

          .table-session-grid {
            display: grid;
            grid-template-columns: 1.4fr 0.9fr;
            gap: 16px;
            margin-top: 16px;
          }

          .cart-panel {
            position: sticky;
            top: 16px;
            align-self: start;
            padding: 16px;
          }

          .cart-panel h2,
          .checkout-card h3,
          .menu-panel h2 {
            margin: 0 0 12px;
            font-family: 'Fraunces', serif;
          }

          .cart-items {
            display: grid;
            gap: 10px;
          }

          .cart-item {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px;
            background: #fff;
          }

          .cart-empty,
          .session-hint {
            color: var(--muted);
            font-size: 0.95rem;
          }

          .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0 0;
            padding-top: 12px;
            border-top: 1px solid var(--line);
            font-weight: 700;
          }

          .checkout-field,
          .checkout-textarea {
            width: 100%;
            margin-top: 10px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
            font: inherit;
          }

          .checkout-actions {
            display: grid;
            gap: 10px;
            margin-top: 12px;
          }

          .checkout-btn,
          .add-btn,
          .clear-btn {
            border: none;
            border-radius: 10px;
            padding: 10px 12px;
            font-weight: 600;
            cursor: pointer;
          }

          .add-btn,
          .checkout-btn.primary {
            background: var(--accent);
            color: #fff;
          }

          .checkout-btn.secondary,
          .clear-btn {
            background: #efe5d7;
            color: var(--ink);
          }

          .order-message {
            margin-top: 12px;
            font-size: 0.95rem;
          }

          .order-message.error {
            color: #7f1d1d;
          }

          .order-message.success {
            color: #0f5132;
          }

          .menu-panel {
            padding: 16px;
          }

          .menu-item-card {
            display: grid;
            grid-template-rows: auto 1fr;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
          }

          .menu-item-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #f4ede2;
          }

          .menu-item-body {
            display: grid;
            gap: 8px;
            padding: 12px;
          }

          .menu-item-price {
            color: var(--accent-strong);
            font-weight: 700;
          }

          @media (max-width: 900px) {
            .table-session-grid {
              grid-template-columns: 1fr;
            }

            .cart-panel {
              position: static;
            }
          }
        `;
        document.head.appendChild(style);
      }

      function ensureCommerceUi() {
        if (cartElements) {
          return cartElements;
        }

        ensureStyleTag();

        const sessionPanel = document.createElement('section');
        sessionPanel.className = 'panel table-session-panel';
        sessionPanel.innerHTML = `
          <div class="session-hint" id="sessionHint">Loading table session...</div>
          <div class="table-session-grid">
            <section class="panel menu-panel">
              <h2>Menu</h2>
              <div id="menuRoot"></div>
            </section>
            <aside class="panel cart-panel">
              <h2>Your Cart</h2>
              <div id="cartItems" class="cart-items"></div>
              <div class="cart-total">
                <span>Total</span>
                <span id="cartTotal">INR 0.00</span>
              </div>
              <input id="customerName" class="checkout-field" type="text" placeholder="Your name (optional)" />
              <textarea id="orderNotes" class="checkout-textarea" rows="3" placeholder="Notes for the kitchen (optional)"></textarea>
              <div class="checkout-actions">
                <button id="codBtn" class="checkout-btn primary" type="button">Place Order</button>
                <button id="onlineBtn" class="checkout-btn secondary" type="button">Pay Online</button>
                <button id="clearCartBtn" class="clear-btn" type="button">Clear Cart</button>
              </div>
              <div id="orderMessage" class="order-message"></div>
            </aside>
          </div>
        `;

        menuContainerEl.classList.add('hidden');
        menuContainerEl.insertAdjacentElement('beforebegin', sessionPanel);

        cartElements = {
          sessionHintEl: document.getElementById('sessionHint'),
          menuRootEl: document.getElementById('menuRoot'),
          cartItemsEl: document.getElementById('cartItems'),
          cartTotalEl: document.getElementById('cartTotal'),
          customerNameEl: document.getElementById('customerName'),
          orderNotesEl: document.getElementById('orderNotes'),
          codBtnEl: document.getElementById('codBtn'),
          onlineBtnEl: document.getElementById('onlineBtn'),
          clearCartBtnEl: document.getElementById('clearCartBtn'),
          orderMessageEl: document.getElementById('orderMessage'),
        };

        return cartElements;
      }

      function updateSessionHint(message) {
        const elements = ensureCommerceUi();
        elements.sessionHintEl.textContent = message;
      }

      function persistState() {
        if (!currentContext) {
          return;
        }

        const namespace = getStorageNamespace(currentContext);
        writeJsonStorage(getCartKey(namespace), Array.from(cart.values()));
        writeJsonStorage(getSessionKey(namespace), currentContext.session || null);
      }

      function loadStoredState(context) {
        const namespaceCandidates = [
          getStorageNamespace(context),
          [escapeStoragePart(window.location.hostname), `t${escapeStoragePart(context.tableId)}`].join(':'),
        ];

        const resolved = { cart: [], session: null };

        for (const namespace of namespaceCandidates) {
          const storedCart = readJsonStorage(getCartKey(namespace));
          const storedSession = readJsonStorage(getSessionKey(namespace));

          if (Array.isArray(storedCart) || storedSession) {
            resolved.cart = Array.isArray(storedCart) ? storedCart : [];
            resolved.session = storedSession || null;
            break;
          }
        }

        return resolved;
      }

      function syncCartFromStoredItems(storedItems) {
        cart.clear();

        storedItems.forEach((item) => {
          if (!item || item.id === undefined || item.id === null) {
            return;
          }

          cart.set(String(item.id), {
            id: item.id,
            name: item.name || 'Untitled item',
            price: Number(item.price || 0),
            quantity: Number(item.quantity || 1),
            category: item.category || 'Other',
            imageUrl: item.imageUrl || '',
          });
        });
      }

      function renderCart() {
        const { cartItemsEl, cartTotalEl } = ensureCommerceUi();
        const entries = Array.from(cart.values());

        if (!entries.length) {
          cartItemsEl.innerHTML = '<p class="cart-empty">Your cart is empty. Add items from the menu to start a table-specific order.</p>';
          cartTotalEl.textContent = 'INR 0.00';
          persistState();
          return;
        }

        let total = 0;
        cartItemsEl.innerHTML = '';

        entries.forEach((item) => {
          const lineTotal = Number(item.price || 0) * Number(item.quantity || 0);
          total += lineTotal;

          const row = document.createElement('article');
          row.className = 'cart-item';
          row.innerHTML = `
            <strong>${item.name}</strong>
            <div>Qty: ${item.quantity}</div>
            <div>${formatPrice(lineTotal)}</div>
            <button type="button" class="clear-btn" data-remove-id="${String(item.id)}">Remove</button>
          `;
          cartItemsEl.appendChild(row);
        });

        cartTotalEl.textContent = formatPrice(total);

        cartItemsEl.querySelectorAll('button[data-remove-id]').forEach((button) => {
          button.addEventListener('click', () => {
            const itemId = String(button.dataset.removeId);
            cart.delete(itemId);
            renderCart();
          });
        });

        persistState();
      }

      function addToCart(item) {
        const key = String(item.id);
        const existing = cart.get(key);

        if (existing) {
          existing.quantity += 1;
        } else {
          cart.set(key, {
            id: item.id,
            name: item.name,
            price: Number(item.price || 0),
            quantity: 1,
            category: item.category || 'Other',
            imageUrl: item.imageUrl || '',
          });
        }

        renderCart();
      }

      function setOrderingState(disabled, message) {
        const elements = ensureCommerceUi();
        [elements.codBtnEl, elements.onlineBtnEl, elements.clearCartBtnEl].forEach((button) => {
          if (button) {
            button.disabled = disabled;
          }
        });

        elements.orderMessageEl.textContent = message || '';
        elements.orderMessageEl.className = message ? 'order-message success' : 'order-message';
      }

      function renderMenu(menuItems) {
        const { menuRootEl } = ensureCommerceUi();
        menuRootEl.innerHTML = '';

        if (!menuItems.length) {
          menuRootEl.innerHTML = '<section class="panel category"><p>No menu items available right now.</p></section>';
          return;
        }

        const groupedMenu = groupByCategory(menuItems);

        groupedMenu.forEach((items, categoryName) => {
          const categorySection = document.createElement('section');
          categorySection.className = 'panel category';

          const title = document.createElement('h2');
          title.textContent = categoryName;
          categorySection.appendChild(title);

          const itemsGrid = document.createElement('div');
          itemsGrid.className = 'items';

          items.forEach((item) => {
            const card = document.createElement('article');
            card.className = 'menu-item-card';

            if (item.imageUrl) {
              const image = document.createElement('img');
              image.alt = item.name;
              image.src = item.imageUrl;
              card.appendChild(image);
            }

            const body = document.createElement('div');
            body.className = 'menu-item-body';

            const name = document.createElement('h3');
            name.textContent = item.name;

            const desc = document.createElement('p');
            desc.textContent = item.description;

            const price = document.createElement('div');
            price.className = 'menu-item-price';
            price.textContent = formatPrice(item.price);

            const addButton = document.createElement('button');
            addButton.type = 'button';
            addButton.className = 'add-btn';
            addButton.textContent = 'Add to Cart';
            addButton.disabled = item.isAvailable === false;
            addButton.addEventListener('click', () => addToCart(item));

            body.appendChild(name);
            body.appendChild(desc);
            body.appendChild(price);
            body.appendChild(addButton);
            card.appendChild(body);
            itemsGrid.appendChild(card);
          });

          categorySection.appendChild(itemsGrid);
          menuRootEl.appendChild(categorySection);
        });
      }

      async function triggerCheckout(paymentMethod) {
        const elements = ensureCommerceUi();
        const tableId = currentContext?.tableId;
        const restaurantId = currentContext?.restaurant?.id || null;
        const sessionToken = currentContext?.session?.sessionToken || null;
        const sessionId = currentContext?.session?.id || null;
        const items = Array.from(cart.values()).map((item) => ({
          menuItemId: item.id,
          name: item.name,
          price: item.price,
          quantity: item.quantity,
        }));

        if (!items.length) {
          elements.orderMessageEl.textContent = 'Add at least one menu item before checkout.';
          elements.orderMessageEl.className = 'order-message error';
          return;
        }

        const checkoutPayload = {
          tableId,
          restaurantId,
          tableSessionId: sessionId,
          sessionToken,
          customerName: elements.customerNameEl.value.trim(),
          notes: elements.orderNotesEl.value.trim(),
          paymentMethod,
          items,
        };

        // Connect your final checkout/payment trigger here.
        // Replace this placeholder with the POST request that creates the order,
        // starts the payment intent/session, and confirms the table-scoped session.
        console.info('Checkout payload for table session:', checkoutPayload);

        // Example hook point:
        // await fetch('https://my-render-backend.onrender.com/api/orders', {
        //   method: 'POST',
        //   headers: { 'Content-Type': 'application/json' },
        //   body: JSON.stringify(checkoutPayload),
        // });

        elements.orderMessageEl.textContent = paymentMethod === 'online'
          ? 'Checkout trigger is ready. Wire your payment gateway here.'
          : 'Order trigger is ready. Wire your final order confirmation endpoint here.';
        elements.orderMessageEl.className = 'order-message success';
      }

      async function fetchTableData(tableId) {
        const response = await fetch(`${API_BASE_URL}?table=${encodeURIComponent(tableId)}`);
        if (!response.ok) {
          throw new Error(`Failed to load table data. Server returned ${response.status}.`);
        }

        return response.json();
      }

      async function loadPage() {
        const tableId = getTableIdFromPath();

        if (!tableId) {
          throw new Error('Invalid table URL. Expected a path like /table/5.');
        }

        setLoading(true);
        clearError();
        menuContainerEl.classList.add('hidden');

        try {
          const data = await fetchTableData(tableId);
          const restaurant = data.restaurant || data.tenant || {};
          const table = data.table || { id: tableId, table_number: data.tableNumber || tableId };
          const menu = normalizeMenuItems(data.menu || data.items || []);
          const lock = data.lock || {};
          const session = data.session || data.tableSession || lock.session || null;

          currentContext = {
            tableId,
            restaurant,
            table,
            session,
          };

          const stored = loadStoredState(currentContext);
          syncCartFromStoredItems(stored.cart);

          if (!currentContext.session && stored.session) {
            currentContext.session = stored.session;
          }

          restaurantTitleEl.textContent = restaurant.name || 'Restaurant';
          tableInfoEl.textContent = table.table_number
            ? `Table: ${table.table_number}`
            : `Table: ${tableId}`;

          setRestaurantLogo(restaurant);
          ensureCommerceUi();
          updateSessionHint(
            currentContext.session
              ? `Table session active for table ${table.table_number || tableId}. Your cart is stored separately for this table.`
              : `Viewing table ${table.table_number || tableId}. Your cart is stored separately for this table.`
          );
          renderMenu(menu);
          renderCart();

          if (lock.isLocked) {
            setOrderingState(false, lock.expiresAt
              ? `This table already has an active session until ${new Date(lock.expiresAt).toLocaleString()}.`
              : 'This table already has an active session.');
          } else {
            setOrderingState(false, 'Cart and checkout are scoped to this table only.');
          }

          menuContainerEl.classList.remove('hidden');
        } catch (error) {
          setError(error.message || 'Unable to load menu. Please try again.');
        } finally {
          setLoading(false);
        }
      }

      retryBtnEl.addEventListener('click', loadPage);

      document.addEventListener('click', (event) => {
        if (event.target && event.target.id === 'codBtn') {
          triggerCheckout('cod');
        }

        if (event.target && event.target.id === 'onlineBtn') {
          triggerCheckout('online');
        }

        if (event.target && event.target.id === 'clearCartBtn') {
          cart.clear();
          renderCart();
          const elements = ensureCommerceUi();
          elements.orderMessageEl.textContent = 'Cart cleared for this table session.';
          elements.orderMessageEl.className = 'order-message success';
        }
      });

      window.addEventListener('beforeunload', persistState);
      loadPage();
    </script>
  </body>
</html>
