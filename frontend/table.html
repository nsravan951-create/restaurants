<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f5f1e8;
        --panel: #fffdf8;
        --ink: #2b2118;
        --muted: #6b5b4a;
        --line: #e6d8c4;
        --accent: #bf4e22;
        --danger-bg: #fff1f1;
        --danger-line: #f4bdbd;
        --danger-text: #7a1d1d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, #fff5df 0%, transparent 32%),
          radial-gradient(circle at 85% 0%, #f8e4d6 0%, transparent 24%),
          var(--bg);
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px;
      }

      .hero h1 {
        margin: 0;
        font-size: 1.6rem;
      }

      .hero p {
        margin: 4px 0 0;
        color: var(--muted);
      }

      .logo {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #f4e7d6;
      }

      .logo-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.5rem;
        color: var(--accent);
      }

      .state {
        margin-top: 14px;
        padding: 14px;
      }

      .hidden {
        display: none;
      }

      .spinner-wrap {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid #e6d8c4;
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        color: var(--danger-text);
        background: var(--danger-bg);
        border-color: var(--danger-line);
      }

      .retry-btn {
        margin-top: 8px;
        border: 0;
        background: var(--accent);
        color: white;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      .menu {
        margin-top: 16px;
        display: grid;
        gap: 14px;
      }

      .category {
        padding: 14px;
      }

      .category h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }

      .items {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }

      .item {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: white;
        padding: 10px;
      }

      .item h3 {
        margin: 0 0 6px;
        font-size: 1rem;
      }

      .desc {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .price {
        margin: 8px 0 0;
        color: var(--accent);
        font-weight: 600;
      }

      .btn-add {
        width: 100%;
        margin-top: 8px;
        border: 1px solid var(--accent);
        background: white;
        color: var(--accent);
        padding: 8px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }

      .btn-add:hover {
        background: var(--accent);
        color: white;
      }

      @media (max-width: 640px) {
        .hero {
          align-items: flex-start;
        }
      }

      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <img id="restaurantLogo" class="logo hidden" alt="Restaurant logo" />
        <div id="restaurantLogoFallback" class="logo logo-fallback">--</div>
        <div>
          <h1 id="restaurantTitle">Restaurant</h1>
          <p id="tableInfo" class="meta"></p>
        </div>
      </header>

      <section id="loadingState" class="panel state">
        <div class="spinner-wrap">
          <span class="spinner" aria-hidden="true"></span>
          <span>Loading menu, please wait...</span>
        </div>
      </section>

      <section id="errorState" class="panel state error hidden">
        <p id="errorText">Something went wrong while loading the menu.</p>
        <button id="retryBtn" class="retry-btn" type="button">Try again</button>
      </section>

      <section id="menuContainer" class="menu hidden"></section>
    </main>

    <script>
      // Configuration: Query Parameter Routing
      const BACKEND_BASE_URL = 'https://restaurant-backend-rxqz.onrender.com';

      // DOM Elements
      const restaurantTitleEl = document.getElementById('restaurantTitle');
      const tableInfoEl = document.getElementById('tableInfo');
      const restaurantLogoEl = document.getElementById('restaurantLogo');
      const restaurantLogoFallbackEl = document.getElementById('restaurantLogoFallback');
      const loadingStateEl = document.getElementById('loadingState');
      const errorStateEl = document.getElementById('errorState');
      const errorTextEl = document.getElementById('errorText');
      const retryBtnEl = document.getElementById('retryBtn');
      const menuContainerEl = document.getElementById('menuContainer');

      // Session State
      const cart = new Map();
      let currentContext = null;

      /**
       * Extract table ID from query parameter: ?id=64
       */
      function getTableIdFromQuery() {
        const params = new URLSearchParams(window.location.search);
        const tableId = params.get('id');
        return tableId && String(tableId).trim() ? String(tableId).trim() : null;
      }

      /**
       * Generate storage key namespace for a specific table
       */
      function getStorageNamespace(tableId) {
        return `qr_table_${tableId}`;
      }

      /**
       * Store cart items to localStorage
       */
      function persistCart(tableId) {
        const namespace = getStorageNamespace(tableId);
        const cartArray = Array.from(cart.values());
        localStorage.setItem(`${namespace}_cart`, JSON.stringify(cartArray));
      }

      /**
       * Load cart from localStorage
       */
      function loadCart(tableId) {
        const namespace = getStorageNamespace(tableId);
        const stored = localStorage.getItem(`${namespace}_cart`);
        if (stored) {
          try {
            const items = JSON.parse(stored);
            cart.clear();
            for (const item of items) {
              cart.set(item.id, item);
            }
          } catch (e) {
            console.warn('Failed to parse stored cart', e);
          }
        }
      }

      /**
       * Store session state to localStorage
       */
      function persistSession(tableId, sessionData) {
        const namespace = getStorageNamespace(tableId);
        localStorage.setItem(`${namespace}_session`, JSON.stringify(sessionData || null));
      }

      /**
       * Load session state from localStorage
       */
      function loadSession(tableId) {
        const namespace = getStorageNamespace(tableId);
        const stored = localStorage.getItem(`${namespace}_session`);
        if (stored) {
          try {
            return JSON.parse(stored);
          } catch (e) {
            console.warn('Failed to parse stored session', e);
          }
        }
        return null;
      }

      /**
       * Clear all stored data for a table (used after successful payment)
       */
      function clearStoredState(tableId) {
        const namespace = getStorageNamespace(tableId);
        localStorage.removeItem(`${namespace}_cart`);
        localStorage.removeItem(`${namespace}_session`);
        cart.clear();
      }

      function setLoading(isLoading) {
        loadingStateEl.classList.toggle('hidden', !isLoading);
      }

      function setError(message) {
        errorTextEl.textContent = message;
        errorStateEl.classList.remove('hidden');
      }

      function clearError() {
        errorStateEl.classList.add('hidden');
      }

      function formatPrice(amount) {
        const value = Number(amount || 0);
        return `INR ${value.toFixed(2)}`;
      }

      function groupMenuByCategory(menuItems) {
        const grouped = new Map();
        for (const item of menuItems) {
          const category = item.category || 'Other';
          if (!grouped.has(category)) {
            grouped.set(category, []);
          }
          grouped.get(category).push(item);
        }
        return grouped;
      }

      function renderMenu(menuItems) {
        menuContainerEl.innerHTML = '';

        if (!Array.isArray(menuItems) || menuItems.length === 0) {
          menuContainerEl.innerHTML = '<section class="category panel"><p>No menu items available.</p></section>';
          menuContainerEl.classList.remove('hidden');
          return;
        }

        const grouped = groupMenuByCategory(menuItems);

        for (const [category, items] of grouped.entries()) {
          const categorySection = document.createElement('section');
          categorySection.className = 'category panel';

          const categoryTitle = document.createElement('h2');
          categoryTitle.textContent = category;
          categorySection.appendChild(categoryTitle);

          const itemsGrid = document.createElement('div');
          itemsGrid.className = 'items';

          for (const item of items) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'item';

            const itemTitle = document.createElement('h3');
            itemTitle.textContent = item.name;
            itemDiv.appendChild(itemTitle);

            if (item.description) {
              const desc = document.createElement('p');
              desc.className = 'desc';
              desc.textContent = item.description;
              itemDiv.appendChild(desc);
            }

            const price = document.createElement('p');
            price.className = 'price';
            price.textContent = formatPrice(item.price);
            itemDiv.appendChild(price);

            const addBtn = document.createElement('button');
            addBtn.textContent = 'Add to Cart';
            addBtn.className = 'btn-add';
            addBtn.addEventListener('click', () => addToCart(item));
            itemDiv.appendChild(addBtn);

            itemsGrid.appendChild(itemDiv);
          }

          categorySection.appendChild(itemsGrid);
          menuContainerEl.appendChild(categorySection);
        }

        menuContainerEl.classList.remove('hidden');
      }

      function addToCart(item) {
        if (cart.has(item.id)) {
          const existing = cart.get(item.id);
          existing.quantity += 1;
          cart.set(item.id, existing);
        } else {
          cart.set(item.id, { ...item, quantity: 1 });
        }
        renderCart();
        persistCart(currentContext.tableId);
      }

      function removeFromCart(itemId) {
        cart.delete(itemId);
        renderCart();
        persistCart(currentContext.tableId);
      }

      function updateQuantity(itemId, quantity) {
        if (quantity <= 0) {
          removeFromCart(itemId);
        } else {
          const item = cart.get(itemId);
          if (item) {
            item.quantity = quantity;
            cart.set(itemId, item);
            renderCart();
            persistCart(currentContext.tableId);
          }
        }
      }

      function calculateCartTotal() {
        let total = 0;
        for (const item of cart.values()) {
          total += (item.price || 0) * (item.quantity || 1);
        }
        return total;
      }

      /**
       * Fetch table context from backend using tableId
       */
      async function fetchTableContext(tableId) {
        const response = await fetch(
          `${BACKEND_BASE_URL}/api/restaurants/table/${encodeURIComponent(tableId)}`
        );
        if (!response.ok) {
          throw new Error(`Failed to load table data. Server returned ${response.status}.`);
        }
        return response.json();
      }

      /**
       * Render the cart panel with checkout functionality
       */
      function renderCartPanel() {
        let cartPanel = document.getElementById('cartPanel');

        if (!cartPanel) {
          // Create cart panel if it doesn't exist
          cartPanel = document.createElement('section');
          cartPanel.id = 'cartPanel';
          cartPanel.className = 'panel';
          cartPanel.style.cssText = `
            margin-top: 16px;
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
          `;

          menuContainerEl.parentNode.insertBefore(cartPanel, menuContainerEl.nextSibling);
        }

        const cartTotal = calculateCartTotal();

        cartPanel.innerHTML = `
          <h2 style="margin: 0 0 16px; font-size: 1.2rem;">Your Cart</h2>
          <div id="cartItemsList" style="margin-bottom: 16px; max-height: 200px; overflow-y: auto;"></div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-weight: 600;">
            <span>Total:</span>
            <span>${formatPrice(cartTotal)}</span>
          </div>
          <input id="customerName" type="text" placeholder="Your name (optional)" style="width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px;" />
          <textarea id="orderNotes" rows="2" placeholder="Notes for kitchen (optional)" style="width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; resize: none;"></textarea>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
            <button id="checkoutBtn" class="retry-btn" type="button" style="background: var(--accent); color: white; margin-top: 0;">Checkout</button>
            <button id="clearCartBtn" type="button" style="background: var(--muted); color: white; padding: 8px; border: none; border-radius: 8px; cursor: pointer;">Clear Cart</button>
          </div>
          <div id="orderMessage" style="display: none; padding: 8px; border-radius: 6px; text-align: center; font-size: 0.9rem;"></div>
        `;

        // Render cart items
        const cartItemsList = cartPanel.querySelector('#cartItemsList');
        if (cart.size === 0) {
          cartItemsList.innerHTML = '<p style="color: var(--muted);">Your cart is empty</p>';
        } else {
          for (const item of cart.values()) {
            const itemDiv = document.createElement('div');
            itemDiv.style.cssText = `
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 8px;
              border-bottom: 1px solid var(--line);
            `;

            const itemInfo = document.createElement('span');
            itemInfo.textContent = `${item.name} × ${item.quantity}`;
            itemInfo.style.fontWeight = '500';

            const itemPrice = document.createElement('span');
            itemPrice.textContent = formatPrice(item.price * item.quantity);

            itemDiv.appendChild(itemInfo);
            itemDiv.appendChild(itemPrice);
            cartItemsList.appendChild(itemDiv);
          }
        }

        // Attach event listeners
        cartPanel.querySelector('#checkoutBtn').addEventListener('click', triggerCheckout);
        cartPanel.querySelector('#clearCartBtn').addEventListener('click', () => {
          cart.clear();
          persistCart(currentContext.tableId);
          renderCartPanel();
        });
      }

      /**
       * Handle checkout: post order and clear on success
       */
      async function triggerCheckout() {
        const cartTotal = calculateCartTotal();

        if (cartTotal <= 0) {
          const orderMsg = document.getElementById('orderMessage');
          orderMsg.textContent = 'Cart is empty. Add items before checkout.';
          orderMsg.style.display = 'block';
          orderMsg.style.backgroundColor = '#f8d7da';
          orderMsg.style.color = '#721c24';
          return;
        }

        const checkoutPayload = {
          tableId: currentContext.tableId,
          restaurantId: currentContext.restaurant?.id,
          items: Array.from(cart.values()),
          total: cartTotal,
          customerName: (document.getElementById('customerName')?.value || 'Guest').trim(),
          notes: (document.getElementById('orderNotes')?.value || '').trim(),
        };

        const orderMsg = document.getElementById('orderMessage');
        orderMsg.textContent = 'Processing checkout...';
        orderMsg.style.display = 'block';
        orderMsg.style.backgroundColor = '#e2e3e5';
        orderMsg.style.color = '#383d41';

        try {
          const response = await fetch(`${BACKEND_BASE_URL}/api/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(checkoutPayload),
          });

          if (!response.ok) {
            throw new Error(`Checkout failed: ${response.status}`);
          }

          const result = await response.json();

          // Check if payment was successful
          if (result.success || result.paymentStatus === 'completed') {
            orderMsg.textContent = 'Order confirmed! Thank you.';
            orderMsg.style.backgroundColor = '#d4edda';
            orderMsg.style.color = '#155724';

            // Clear session and cart after successful payment
            clearStoredState(currentContext.tableId);

            setTimeout(() => {
              location.reload();
            }, 2000);
          } else {
            orderMsg.textContent = 'Order created. Awaiting payment confirmation.';
            orderMsg.style.backgroundColor = '#e2e3e5';
            orderMsg.style.color = '#383d41';
          }
        } catch (error) {
          orderMsg.textContent = `Checkout error: ${error.message}`;
          orderMsg.style.display = 'block';
          orderMsg.style.backgroundColor = '#f8d7da';
          orderMsg.style.color = '#721c24';
        }
      }

      /**
       * Initialize page: extract tableId from query param, load context, restore cart
       */
      async function loadPage() {
        const tableId = getTableIdFromQuery();

        if (!tableId) {
          setError('Invalid table URL. Expected: /table.html?id=64');
          setLoading(false);
          return;
        }

        setLoading(true);
        clearError();
        menuContainerEl.classList.add('hidden');

        try {
          // Fetch table context from backend
          const data = await fetchTableContext(tableId);
          const restaurant = data.restaurant || {};
          const table = data.table || { id: tableId, table_number: tableId };
          const menu = data.menu || [];

          currentContext = {
            tableId,
            restaurant,
            table,
          };

          // Load persisted cart and session from localStorage
          loadCart(tableId);
          const storedSession = loadSession(tableId);

          // Update page header
          restaurantTitleEl.textContent = restaurant.name || 'Restaurant';
          tableInfoEl.textContent = table.table_number
            ? `Table: ${table.table_number}`
            : `Table: ${tableId}`;

          // Set restaurant logo if available
          if (restaurant.logo_url || restaurant.logo) {
            restaurantLogoEl.src = restaurant.logo_url || restaurant.logo;
            restaurantLogoEl.classList.remove('hidden');
            restaurantLogoFallbackEl.classList.add('hidden');
          } else {
            restaurantLogoFallbackEl.textContent = (restaurant.name || 'R').charAt(0).toUpperCase();
            restaurantLogoEl.classList.add('hidden');
            restaurantLogoFallbackEl.classList.remove('hidden');
          }

          // Render menu and cart
          renderMenu(menu);
          renderCartPanel();

        } catch (error) {
          setError(error.message || 'Unable to load menu. Please refresh and try again.');
        } finally {
          setLoading(false);
        }
      }

      // Retry button
      retryBtnEl.addEventListener('click', loadPage);

      // Initialize on page load
      document.addEventListener('DOMContentLoaded', loadPage);
    </script>
  </body>
</html>
