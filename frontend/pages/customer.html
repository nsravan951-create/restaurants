<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <main class="customer-layout">
      <header class="panel">
        <h1 id="restaurantTitle">Loading menu...</h1>
        <p id="tableInfo"></p>
        <p id="sessionTimer" class="message"></p>
        <div id="tableLockNotice" class="message"></div>
        <button id="joinSessionBtn" class="btn btn-light hidden" type="button">Join Existing Order Session</button>
      </header>

      <section class="panel">
        <section id="offersSection" class="offers-section hidden" aria-labelledby="offersHeading">
          <div class="section-head">
            <div>
              <h2 id="offersHeading">Special Offers &amp; Combos</h2>
              <p>Save more with restaurant-made deals.</p>
            </div>
          </div>
          <div id="offersContainer" class="offers-scroller"></div>
        </section>
        <div id="menuContainer" class="menu-grid"></div>
      </section>

      <aside class="panel sticky-cart">
        <h2>Your Cart</h2>
        <div id="cartItems"></div>
        <p class="total">Total: INR <span id="cartTotal">0</span></p>
        <input id="customerName" placeholder="Your name (optional)" />
        <textarea id="orderNotes" placeholder="Notes (optional)"></textarea>

        <div class="payment-actions">
          <button id="orderFoodBtn" class="btn btn-primary">Order Food</button>
          <button id="codBtn" class="btn btn-dark hidden">Pay with Cash</button>
          <button id="onlineBtn" class="btn btn-primary hidden">Pay Online with Cashfree</button>
        </div>
        <div id="orderMessage" class="message"></div>
      </aside>

      <div id="postOrderModal" class="bill-modal hidden" aria-hidden="true">
        <div class="bill-modal__sheet" role="dialog" aria-labelledby="postOrderTitle">
          <header class="bill-modal__head">
            <div>
              <p class="eyebrow">Food ordered</p>
              <h2 id="postOrderTitle">Pay after enjoying your food</h2>
              <p id="postOrderTotal" class="hero-copy"></p>
            </div>
          </header>
          <div class="bill-modal__body">
            <p class="hero-copy">Your food is added to this table bill. Order more anytime, and it will be added to the same bill.</p>
            <div id="postOrderActions" class="payment-actions">
              <button id="orderMoreBtn" class="btn btn-light" type="button">Order More</button>
              <button id="completeBookingBtn" class="btn btn-primary" type="button">Complete Booking &amp; Proceed to Payment</button>
            </div>
            <div id="checkoutActions" class="payment-actions hidden">
              <button id="modalCodBtn" class="btn btn-dark" type="button">Cash / COD</button>
              <button id="modalOnlineBtn" class="btn btn-primary" type="button">Pay Online with Cashfree</button>
            </div>
            <div id="postOrderMessage" class="message"></div>
          </div>
        </div>
      </div>

    <footer class="brand-footer">Powered by Online Solutionzzz</footer>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/customer.js"></script>
  </body>
</html>
